<div class="sidebar-header">
  <h3>Filtra per</h3>
  <button type="button" class="btn btn-secondary" id="sidebarClose">
  <i class="bi bi-x-lg"></i>
  </button>
</div>
<div class="sidebar-content">
  <div id="accordion">
    {{#each filters}}
    <div class="card">
      <div class="card-header" id="filter-heading-{{@index}}">
      <h5 class="mb-0">
        <button class="btn btn-link{{#unless active}} collapsed{{/unless}}" data-toggle="collapse" data-target="#filter-collapse-{{@index}}" aria-expanded="{{#if active}}true{{else}}false{{/if}}" aria-controls="filter-collapse-{{@index}}">
        {{label}}
        </button>
      </h5>
      </div>

      <div id="filter-collapse-{{@index}}" class="collapse{{#if active}} show{{/if}}" aria-labelledby="filter-heading-{{@index}}" data-parent="#accordion">
        <div class="card-body">
          {{#if terms}}
          <div class="form-check">
            {{#each buckets}}
            <input class="form-check-input filter-term" type="checkbox" id="filter-{{@../index}}-{{@index}}" data-field="{{../key}}" value="{{key}}"{{#if checked}} checked{{/if}}>
            <label class="form-check-label" for="filter-{{@../index}}-{{@index}}">{{key}} - {{doc_count}}</label><br>
            {{/each}}
          </div>
          {{/if}}
          {{#if range}}
          <div class="filter-range" data-field="{{key}}">
            <label for="filter-{{@index}}-from">Da <b class="range-from-value">{{from}}</b></label>
            <input type="range" class="custom-range range-from" id="filter-{{@index}}-from" min="{{min}}" max="{{max}}" value="{{from}}">
            <label for="filter-{{@index}}-to">A <b class="range-to-value">{{to}}</b></label>
            <input type="range" class="custom-range range-to" id="filter-{{@index}}-to" min="{{min}}" max="{{max}}" value="{{to}}">
          </div>
          {{/if}}
        </div>
      </div>
    </div>
    {{/each}}
  </div>
</div>
