<div class="card rounded-0">
  <div class="row no-gutters">
    <div class="col-md-4 d-flex align-items-center">
      <img src="{{#imageUrl}}{{.}}{{/imageUrl}}{{^imageUrl}}/images/{{identificativo}}.png{{/imageUrl}}" class="card-img img-fluid rounded-0">
    </div>
    <div class="col-md-8">
      <div class="card-body" style="padding: 0.5rem 1.25rem">
        <small class="text-muted">{{{portata}}}</small>
        <h3 class="card-title"><a href="/ricetta/{{identificativo}}">{{{titolo}}}</a></h3>
        {{#with sottotitolo}}<p class="card-text">{{{.}}} <br>{{/with}}
        <small class="text-muted">{{difficoltà_stringa}} · {{tempi.totale}} minuti</small></p>
        {{#tag}}<a href="/search?tag={{tagParam .}}" class="badge badge-secondary badge-outlined rounded-0">{{{.}}}</a>{{#unless @last}}&nbsp;{{/unless}}{{/tag}}<br><br>
        {{#each hl2}}{{#each this}}
        <small>{{@key}}: {{{this}}}</small><br>
        {{/each}}{{/each}}
      </div>
    </div>
  </div>
</div>
