<!DOCTYPE html>
<html lang="it">
  <head>
    <title>Pagina con immagine e ricerca</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.4/font/bootstrap-icons.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/home.css">
  </head>
  <body>
    <div class="container">
      <div class="image-container">
        <img src="/static/logo.png" alt="Immagine" />
      </div>
      <div class="search-container">
        <form class="form-inline flex-fill my-2 my-lg-0 ml-auto" onsubmit="event.preventDefault(); wannaSearch(event.target[0].value)">
          <div class="input-group flex-fill">
            <input id="main-input" class="form-control flex-fill rounded-0" type="search" placeholder="" aria-label="">
            <div class="input-group-append">
              <button class="btn btn-light rounded-0" type="submit"><i class="bi bi-search"></i></button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <script type="text/javascript" src="/static/config.js"></script>
    <script type="text/javascript" src="/js/search.js"></script>
  </body>
</html>
